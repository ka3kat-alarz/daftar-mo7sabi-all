<style>
:root{--bg:#f4f6f9;--card:#fff;--text:#1a1a1a;--sub:#666;--line:#e2e5ea;--accent:#305496;--accent2:#4472c4;--danger:#c0392b;--input:#fafbfc;

@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){--bg:#14181f;--card:#1d222b;--text:#eee;--sub:#9aa0aa;--line:#2c3340;--input:#232a35}}
:root[data-theme="dark"]{--bg:#14181f;--card:#1d222b;--text:#eee;--sub:#9aa0aa;--line:#2c3340;--input:#232a35}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font-family:Tahoma,'Segoe UI',Arial,sans-serif;min-height:100%}
header{background:var(--accent);color:#fff;padding:14px 16px calc(14px + env(safe-area-inset-top,0));text-align:center;font-size:20px;font-weight:bold}
.tabs{display:flex;position:sticky;top:0;z-index:5;background:var(--card);border-bottom:2px solid var(--line)}
.tab{flex:1;padding:12px 4px;text-align:center;cursor:pointer;font-size:14px;color:var(--sub);border-bottom:3px solid transparent}
.tab.active{color:var(--accent2);border-color:var(--accent2);font-weight:bold}
main{padding:14px;max-width:760px;margin:0 auto}
.card{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:12px;margin-bottom:12px}
h3{margin:0 0 10px;font-size:16px;color:var(--accent2)}
table{width:100%;border-collapse:collapse;font-size:13px}
th,td{border:1px solid var(--line);padding:6px;text-align:center}
th{background:var(--input);font-size:12px}
input,select{width:100%;padding:7px;border:1px solid var(--line);border-radius:6px;background:var(--input);color:var(--text);font-size:13px}
.row{display:flex;gap:6px;margin-bottom:8px;flex-wrap:wrap}
.row>*{flex:1;min-width:80px}
button{background:var(--accent2);color:#fff;border:none;border-radius:6px;padding:8px 12px;font-size:13px;cursor:pointer}
button.sm{padding:4px 8px;font-size:12px}
button.danger{background:var(--danger)}
button.ghost{background:transparent;color:var(--accent2);border:1px solid var(--accent2)}
.overflow{overflow-x:auto}
.tot{display:flex;justify-content:space-between;padding:8px 4px;font-weight:bold;border-top:1px dashed var(--line);margin-top:6px}
.result{background:#fce4d6;color:#7a3b00;border-radius:8px;padding:10px;text-align:center;font-weight:bold;font-size:16px;margin-top:8px}
:root[data-theme="dark"] .result,:root:not([data-theme="light"]) .result{background:#4a2f18;color:#ffcf9e}
.daygrid{display:grid;grid-template-columns:repeat(6,1fr);gap:6px;margin-bottom:10px}
.daybtn{padding:8px 0;text-align:center;border:1px solid var(--line);border-radius:6px;cursor:pointer;font-size:13px}
.daybtn.sel{background:var(--accent2);color:#fff}
.small{font-size:11px;color:var(--sub)}
#toast{position:fixed;left:50%;bottom:calc(24px + env(safe-area-inset-bottom,0px));transform:translateX(-50%) translateY(20px);background:#1e8e3e;color:#fff;padding:14px 26px;border-radius:12px;font-size:17px;font-weight:bold;box-shadow:0 6px 20px rgba(0,0,0,.3);opacity:0;pointer-events:none;transition:all .25s;z-index:99;max-width:90%;text-align:center}
#toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
#toast.err{background:#c0392b}
#jr.pday .card{border-top:5px solid #f0a020;background:#fff8ea}
#jr.pnight .card{border-top:5px solid #3a3f9a;background:#eef0fb}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) #jr.pday .card{background:#2b2416}:root:not([data-theme="light"]) #jr.pnight .card{background:#1b2040}}
:root[data-theme="dark"] #jr.pday .card{background:#2b2416}
:root[data-theme="dark"] #jr.pnight .card{background:#1b2040}
.shift{border-radius:10px;padding:12px;text-align:center;font-size:18px;font-weight:bold;margin-bottom:12px}
.shift.day{background:linear-gradient(90deg,#ffd76a,#f0a020);color:#5a3500}
.shift.night{background:linear-gradient(90deg,#1c2050,#3a3f9a);color:#fff}
.daybtn .mk{display:flex;justify-content:center;gap:3px;margin-top:3px}
.daybtn .mk span,.lg{display:inline-block;min-width:15px;font-size:9px;line-height:14px;border-radius:4px;background:var(--line);color:var(--sub);text-align:center}
.daybtn .mk span.on,.lg.on{background:#1e8e3e;color:#fff}
.daybtn.full{border-color:#1e8e3e;box-shadow:inset 0 0 0 1px #1e8e3e}
.daybtn.half{border-color:#f0a020;box-shadow:inset 0 0 0 1px #f0a020}
.daybtn.sel .mk span{background:rgba(255,255,255,.3);color:#fff}
.daybtn.sel .mk span.on{background:#1e8e3e}
.shift-date{font-size:24px;letter-spacing:.5px}
.amtwrap{display:flex;gap:4px;align-items:center}
.amtwrap input{flex:1;min-width:70px}
.usdbtn{flex:none;padding:6px 6px;font-size:11px;background:#1e8e3e;white-space:nowrap}
#jr .wishcard{border-top-color:#2c6fbb!important}
#jr .wishcard h3{color:#2c6fbb}
#jr .supcard{border-top-color:#8e44ad!important}
#jr .supcard h3{color:#8e44ad}
.tab{font-size:13px}
.daybtn.today{outline:3px solid #f0a020;outline-offset:1px}
.tabs{overflow-x:auto;-webkit-overflow-scrolling:touch}
.tab{flex:1 0 auto;padding:12px 10px;white-space:nowrap}
.kpis{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.kpi{background:var(--input);border:1px solid var(--line);border-radius:8px;padding:8px;text-align:center}
.kpi b{display:block;font-size:16px;margin-top:2px}
a{color:var(--accent2)}
.bk-page{border-right:5px solid #f0a020}
.bk-page.night{border-right-color:#3a3f9a}
.bk-page summary{cursor:pointer;font-weight:bold;list-style:none;display:flex;justify-content:space-between;gap:6px;flex-wrap:wrap;align-items:center}
.bk-page summary::-webkit-details-marker{display:none}
.bk-sec td{background:var(--input);font-weight:bold;text-align:right}
.bk-t td:nth-child(2){text-align:right}
.bk-cover{background:linear-gradient(135deg,#305496,#4472c4);color:#fff;border-radius:12px;padding:18px;text-align:center;margin-bottom:12px}
.bk-cover .big{font-size:24px;font-weight:bold}
.bk-miss{color:#c0392b;font-size:12px;padding:4px 8px}

.bk-res.pos{background:#d4edda;color:#155724}.bk-res.neg{background:#f8d7da;color:#842029}

 header,.tabs,#toast,.noprint,#authGate{display:none!important}

<style id="skin">
/* ===== Skin v1 — دفتر المحاسبة =====
   Layout: one phone column; navy ledger cover on top, pill tabs, soft paper cards, sesame-gold highlights */
:root{
  --bg:#eef1f6; --card:#ffffff; --text:#18202e; --sub:#667085; --line:#e3e7ee; --input:#f6f8fb;
  --accent:#1f3a6e; --accent2:#2f5bb0; --danger:#c2412d;
  --brand:#1f3a6e; --brand-2:#2c4f92; --gold:#d19a2a; --gold-soft:#fbf1dc; --soft:#f3f6fb; --ok:#1d8a4a;
  --shadow:0 1px 2px rgba(20,32,60,.06),0 4px 14px rgba(20,32,60,.05); --on-accent:#ffffff;
  --f-body:Tahoma,'Segoe UI',Arial,sans-serif;
  --f-display:Tahoma,'Segoe UI',Arial,sans-serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0f131a; --card:#181e28; --text:#e9ecf2; --sub:#9aa3b2; --line:#283142; --input:#1f2633;
  --accent:#9cb7ef; --accent2:#8fb0f0; --danger:#f07a66;
  --brand:#16294f; --brand-2:#223c70; --gold:#e6b14f; --gold-soft:#3a2f1a; --soft:#1d2430; --ok:#5fcf8e;
  --shadow:0 1px 2px rgba(0,0,0,.4); --on-accent:#0d1830; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0f131a; --card:#181e28; --text:#e9ecf2; --sub:#9aa3b2; --line:#283142; --input:#1f2633;
  --accent:#9cb7ef; --accent2:#8fb0f0; --danger:#f07a66;
  --brand:#16294f; --brand-2:#223c70; --gold:#e6b14f; --gold-soft:#3a2f1a; --soft:#1d2430; --ok:#5fcf8e;
  --shadow:0 1px 2px rgba(0,0,0,.4); --on-accent:#0d1830; color-scheme:dark}

body{font-family:var(--f-body);font-size:14.5px;line-height:1.55;background:var(--bg)}
input,select,button,textarea{font-family:inherit}

/* cover */
header{background:linear-gradient(160deg,var(--brand) 0%,var(--brand-2) 100%);border-radius:0 0 22px 22px;
  padding:18px 16px 16px;box-shadow:0 6px 20px rgba(20,40,90,.18);position:relative;overflow:hidden}
header::after{content:"";position:absolute;inset:0;pointer-events:none;opacity:.10;
  background-image:radial-gradient(circle at 20% 30%,#fff 1.2px,transparent 1.6px),radial-gradient(circle at 70% 60%,#fff 1px,transparent 1.5px);
  background-size:26px 22px,34px 30px}
header>*{position:relative;z-index:1}
#shopTitle{font-family:var(--f-display);font-size:24px;letter-spacing:.2px}
header .row{gap:8px;margin-top:6px}
header .row button{border-radius:12px!important;background:rgba(255,255,255,.12)!important;border:1px solid rgba(255,255,255,.35)!important;
  font-weight:600;padding:9px 10px!important;backdrop-filter:blur(4px)}

/* tabs as pills */
.tabs{top:env(safe-area-inset-top,0px);background:color-mix(in srgb,var(--bg) 88%,transparent);backdrop-filter:blur(10px);
  border-bottom:none;padding:10px 10px 8px;gap:6px;scrollbar-width:none}
.tabs::-webkit-scrollbar{display:none}
.tab{flex:0 0 auto;border:1px solid var(--line);border-bottom:1px solid var(--line);border-radius:999px;padding:8px 14px;
  background:var(--card);color:var(--sub);font-size:13.5px;font-weight:600;transition:background .15s,color .15s}
.tab.active{background:var(--brand);border-color:var(--brand);color:#fff}

main{padding:14px 14px 40px;padding-left:max(14px,env(safe-area-inset-left,0px));padding-right:max(14px,env(safe-area-inset-right,0px))}
.card{border-radius:16px;border:1px solid var(--line);box-shadow:var(--shadow);padding:14px}
h3{font-family:var(--f-display);font-weight:700;font-size:17px;color:var(--text);display:flex;align-items:center;gap:6px}
h3::before{content:"";width:4px;height:16px;border-radius:3px;background:var(--gold);flex:none}
.small{color:var(--sub)}

/* tables: horizontal rules only */
table{font-size:13.5px;font-variant-numeric:tabular-nums}
th,td{border:none;border-bottom:1px solid var(--line);padding:8px 6px}
th{background:var(--soft);color:var(--sub);font-weight:600;font-size:12px}
tr:last-child td{border-bottom:none}

/* fields + buttons */
input,select,textarea{border-radius:11px;border:1px solid var(--line);background:var(--input);padding:9px 10px;font-size:14px}
input:focus,select:focus,textarea:focus{outline:none;border-color:var(--gold);box-shadow:0 0 0 3px color-mix(in srgb,var(--gold) 25%,transparent)}
button{border-radius:11px;font-weight:600;padding:9px 14px;background:var(--accent2);transition:transform .08s,filter .15s}
button:active{transform:scale(.97)}
button:focus-visible,.tab:focus-visible{outline:3px solid var(--gold);outline-offset:2px}
button.sm{border-radius:9px;padding:5px 9px}
button.ghost{background:transparent;color:var(--accent2);border:1.5px solid color-mix(in srgb,var(--accent2) 55%,transparent)}
button.danger{background:var(--danger)}
.usdbtn{background:var(--ok);border-radius:9px}

/* numbers & totals */
.kpis{gap:10px}
.kpi{border-radius:14px;background:var(--soft);border:1px solid var(--line);padding:10px 8px}
.kpi b{font-size:18px;font-variant-numeric:tabular-nums;letter-spacing:.2px}
.tot{border-top:1px dashed var(--line);font-variant-numeric:tabular-nums}
.result{border-radius:14px;font-size:18px;padding:12px;font-variant-numeric:tabular-nums}

/* jarda page */
.shift{border-radius:16px;box-shadow:var(--shadow);padding:14px}
.shift.day{background:linear-gradient(120deg,#ffe29a,#f2b33d);color:#4a2c00}
.shift.night{background:linear-gradient(120deg,#1a2350,#36408f);color:#fff}
.shift-date{font-family:var(--f-display);font-size:23px}
#jr.pday .card{border-top:4px solid #f2b33d;background:var(--card)}
#jr.pnight .card{border-top:4px solid #4a55b8;background:var(--card)}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) #jr.pday .card,:root:not([data-theme="light"]) #jr.pnight .card{background:var(--card)}}
:root[data-theme="dark"] #jr.pday .card,:root[data-theme="dark"] #jr.pnight .card{background:var(--card)}
.daygrid{gap:7px}
.daybtn{border-radius:12px;background:var(--card);padding:7px 0;font-weight:600;font-variant-numeric:tabular-nums}
.daybtn.sel{background:var(--brand);border-color:var(--brand)}
.daybtn.today{outline:3px solid var(--gold)}

/* overlays */
#toast{border-radius:16px;font-family:var(--f-body)}
#askModal .card,#empModal .card,#shareModal .card{border-radius:18px}
.bk-cover{background:linear-gradient(160deg,var(--brand),var(--brand-2));border-radius:18px}
.bk-cover .big{font-family:var(--f-display)}
@media (prefers-reduced-motion: reduce){*{transition:none!important}}
/* jarda rows: give the item name room, keep amount + $ compact */
#jr table td{padding:7px 3px}
#jr table td:nth-child(2){width:38%;min-width:100px}
#jr .amtwrap{gap:4px}
#jr .amtwrap input{min-width:0;width:100%;padding:8px 6px;font-size:13.5px}
#jr table td:nth-child(2) input{padding:8px 7px}
#jr .usdbtn{padding:7px 5px;font-size:10.5px}
#jr table td:first-child{width:22px}
#jr table td:last-child{width:34px}
#jr table button.danger.sm{padding:5px 8px}
@media (max-width:380px){
 #jr table td{padding:6px 2px}
 #jr .amtwrap input,#jr table td:nth-child(2) input{font-size:12.5px;padding:7px 4px}
 #jr .usdbtn{font-size:10px;padding:6px 3px}
 #jr table button.danger.sm{padding:4px 6px}
 #jr table td:nth-child(2){width:36%;min-width:90px}
}

/* readable text on filled buttons in both themes */
button{color:var(--on-accent)}
button.ghost{color:var(--accent2)}
#askModal button#askYes,#empModal button:not(.ghost){color:var(--on-accent)}
/* printing is not available inside the viewer */
button[onclick="bookPrint()"]{display:none}

</style>
</head>

<script>
const APP_PASSWORD='6872';
function checkAuth(){ try{ localStorage.removeItem('dm_auth'); }catch(e){} return false; }
function tryLogin(){
 const v=document.getElementById('authPass').value;
 if(v===APP_PASSWORD){ document.getElementById('authGate').remove(); }
 else document.getElementById('authErr').textContent='كلمة السر غلط، حاول كمان';
}
if(!checkAuth()){
 const gate=document.createElement('div');
 gate.id='authGate';
 gate.style.cssText='position:fixed;inset:0;background:var(--bg);color:var(--text);z-index:999;display:flex;align-items:center;justify-content:center;flex-direction:column;gap:12px;padding:20px';
 gate.innerHTML='<div style="font-size:40px">🔒</div><div style="font-weight:bold">أدخل كلمة السر للدخول</div>'
  +'<input id="authPass" type="password" style="max-width:220px;padding:8px;border-radius:6px;border:1px solid #ccc" placeholder="كلمة السر" onkeydown="if(event.key===\'Enter\'){event.preventDefault();event.stopPropagation();tryLogin()}">'
  +'<button onclick="tryLogin()">دخول</button><div id="authErr" class="small" style="color:#c0392b"></div>';
 document.body.appendChild(gate);
 setTimeout(()=>{const i=document.getElementById('authPass'); if(i) i.focus();},100);
}
let db=null, uid=null, employeesList=[], withdrawalsList=[], employeesDocs=[], knownItems=[];
document.querySelectorAll('.tab').forEach(t=>t.onclick=()=>{

const AR_DAYS=['الأحد','الاثنين','الثلاثاء','الأربعاء','الخميس','الجمعة','السبت'];
function dayNameOf(year,month,day){ return AR_DAYS[new Date(year,month-1,day).getDay()]; }
function dispDate(v){
 if(!v) return '';
 const m1=/^(\d{4})-(\d{2})-(\d{2})$/.exec(v);
 const m2=/^(\d{2})\/(\d{2})\/(\d{4})$/.exec(v);
 let d;
 if(m1) d=new Date(+m1[1],+m1[2]-1,+m1[3]);
 else if(m2) d=new Date(+m2[3],+m2[2]-1,+m2[1]);
 else return v;
 const dd=String(d.getDate()).padStart(2,'0'), mm=String(d.getMonth()+1).padStart(2,'0'), yyyy=d.getFullYear();
 return `${AR_DAYS[d.getDay()]} ${dd}/${mm}/${yyyy}`;
}
const toLatin=v=>String(v==null?'':v).replace(/[\u0660-\u0669]/g,c=>c.charCodeAt(0)-0x0660).replace(/[\u06F0-\u06F9]/g,c=>c.charCodeAt(0)-0x06F0).replace(/[\u066B]/g,'.').replace(/[\u066C\u060C]/g,',');
const raw=v=>{ let t=toLatin(v).replace(/,/g,'').trim(); if((t.match(/\./g)||[]).length>1) t=t.replace(/\./g,''); return Number(t)||0; };
function fmtInput(el){
 let pos=null; try{ pos=el.selectionStart; }catch(e){}
 const before=pos==null?null:toLatin(el.value.slice(0,pos)).replace(/[^0-9.]/g,'').length;
 let v=toLatin(el.value).replace(/,/g,'').replace(/[^0-9.]/g,'');
 if((v.match(/\./g)||[]).length>1) v=v.replace(/\./g,'');
 let parts=v.split('.');
 parts[0]=parts[0].replace(/\B(?=(\d{3})+(?!\d))/g,',');
 const nv=parts.length>1?parts[0]+'.'+parts[1]:parts[0];
 if(nv===el.value) return;
 el.value=nv;
 if(before!=null && document.activeElement===el){ let k=0,c=0; while(k<nv.length && c<before){ if(/[0-9.]/.test(nv[k])) c++; k++; } try{ el.setSelectionRange(k,k); }catch(e){} }
}
document.addEventListener('focusin',e=>{ const t=e.target; if(t&&t.tagName==='INPUT'&&t.getAttribute('inputmode')==='decimal'){ if(raw(t.value)===0) t.value=''; else setTimeout(()=>{ try{t.select();}catch(_){} },0); } });
document.addEventListener('keydown',e=>{
 if(e.key==='Enter' && (e.target.tagName==='INPUT'||e.target.tagName==='SELECT')){
  e.preventDefault();
  const r0=e.target.getBoundingClientRect();
  const cx=r0.left+r0.width/2, cy=r0.top+r0.height/2;
  const all=Array.from(document.querySelectorAll('main input,main select,main button')).filter(el=>el.offsetParent!==null && !el.disabled && el!==e.target);
  let best=null,bestScore=Infinity;
  for(const el of all){
   const r=el.getBoundingClientRect();
   if(r.top<=cy+2) continue;
   const ecx=r.left+r.width/2;
   const dy=r.top-cy, dx=Math.abs(ecx-cx);
   const score=dy+dx*3;
   if(score<bestScore){bestScore=score;best=el;}
  }
  if(best) best.focus(); else e.target.blur();
 }
});

function pDate(x){ const a=/^(\d{4})-(\d{2})-(\d{2})$/.exec(x||''); if(a) return new Date(+a[1],+a[2]-1,+a[3]); const b=/^(\d{2})\/(\d{2})\/(\d{4})$/.exec(x||''); if(b) return new Date(+b[3],+b[2]-1,+b[1]); return null; }

function cycleFrom(v,y,m){
 const sd=pDate(v&&v.startDate);
 if(!sd) return {from:new Date(y,m-1,1),to:new Date(y,m,0),cal:true,m,y};
 const S=sd.getDate(); const from=new Date(y,m-1,Math.min(S,dimOf(y,m)));

 if(to<sd) return {before:true,from,to,cal:false,m,y};
 return {from:from<sd?sd:from,to,cal:false,m,y};
}

 if(sel!=='cur') return cycleFrom(v,YEAR,sel);

 return c;
}

 if(!amt){ toast('اكتب المبلغ',true); return; }
 const x=/^(\d{4})-(\d{2})-(\d{2})$/.exec(dv); const date=x?`${x[3]}/${x[2]}/${x[1]}`:dv;

 try{ await db.collection('withdrawals').add({code:document.getElementById('w_code').value.trim()||(emp?emp.code:''),name,date,amount:amt,currency:document.getElementById('w_cur').value,note:document.getElementById('w_note').value.trim(),ts:Date.now()});

async function toJpeg(file){
 // any image (incl. iPhone HEIC) -> resized JPEG; returns null if the browser can't decode it
 const max=1600;
 const draw=(src,w,h)=>{ const k=Math.min(1,max/Math.max(w,h)); const c=document.createElement('canvas'); c.width=Math.max(1,Math.round(w*k)); c.height=Math.max(1,Math.round(h*k)); c.getContext('2d').drawImage(src,0,0,c.width,c.height); return new Promise(r=>c.toBlob(r,'image/jpeg',0.8)); };
 try{ if(window.createImageBitmap){ const bmp=await createImageBitmap(file); return await draw(bmp,bmp.width,bmp.height); } }catch(e){}
 try{ const url=URL.createObjectURL(file); const img=await new Promise((res,rej)=>{const i=new Image(); i.onload=()=>res(i); i.onerror=rej; i.src=url;}); const out=await draw(img,img.naturalWidth,img.naturalHeight); URL.revokeObjectURL(url); return out; }catch(e){}
 return null;
}

 let blob=file, type=(file.type||'').toLowerCase();
 const isPdf=type==='application/pdf' || /\.pdf$/i.test(file.name||'');
 if(isPdf){ type='application/pdf'; }
 else{
  const j=await toJpeg(file);
  if(j && j.size>0){ blob=j; type='image/jpeg'; }
  else if(!OK_TYPES.includes(type)) throw {code:'unsupported_type',message:'نوع الصورة '+(type||'مش معروف')};
 }
 try{ return await a.upload(blob,{type}); }

function pageStats(v){ const sum=a=>(a||[]).reduce((s,r)=>s+(Number(r.amount)||0),0);
 let e=0,wl=0; (v.expenses||[]).forEach(r=>{ const a=Number(r.amount)||0; if(isNonExp(r.desc)) wl+=a; else e+=a; });
 const w=sum(v.withdrawals),u=sum(v.suppliers),ws=sum(v.wish)+wl, box=(Number(v.box1)||0)+(Number(v.box2)||0)*rateOf(v), j=Number(v.jardaValue)||0;
 return {j,e,w,u,ws,res:(e+w+u+ws+box)-j}; }
let lastBackup=undefined;
function monthNums(m){
 const pages=allJarda.filter(v=>v.month===m && isWritten(v));
 let S={j:0,e:0,w:0,u:0,ws:0,res:0}; pages.forEach(v=>{ const x=pageStats(v); for(const k in S) S[k]+=x[k]; });

}

 return `<div class="card overflow"><h3>📊 مقارنة مع ${MONTHS[pm]}</h3>

}

function normTxt(x){ return toLatin(String(x||'')).replace(/[ً-ْـ]/g,'').replace(/[أإآ]/g,'ا').replace(/ة/g,'ه').replace(/ى/g,'ي').replace(/\s+/g,' ').trim().toLowerCase(); }

function doSearch(){
 const el=document.getElementById('srch_res');

 const sec=srchVal('f_sec')||'all', per=srchVal('f_per')||'all';
 const fromV=srchVal('f_from'), toV=srchVal('f_to');
 const minA=raw(srchVal('f_min')), maxA=raw(srchVal('f_max'));
 const anyFilter=q||sec!=='all'||per!=='all'||fromV||toV||minA||maxA;
 if(!anyFilter){ lastHits=[]; el.innerHTML='<div class="small">اكتب اسم أو مبلغ، أو اختار فلتر واحد عالأقل.</div>'; return; }
 const num=q&&/^[\d,.\s]+$/.test(q)?raw(q):0;
 const Y=(typeof YEAR!=='undefined'?YEAR:2026);
 const key=(m,d)=>m*100+d;
 const pd=s=>{ const x=/^(\d{4})-(\d{2})-(\d{2})$/.exec(s||''); return x?key(+x[2],+x[3]):null; };
 const fK=pd(fromV), tK=pd(toV);
 const amtOk=a=>(!minA||a>=minA)&&(!maxA||a<=maxA);
 const hits=[];
 allJarda.forEach(v=>{
  if(!v.month||!v.day) return;
  const k=key(v.month,v.day);
  if(fK!==null&&k<fK) return; if(tK!==null&&k>tK) return;
  if(per!=='all'&&String(v.page)!==per) return;
  SRCH_SECS.forEach(([s,lab])=>{ if(sec!=='all'&&sec!==s) return;
   (v[s]||[]).forEach(r=>{ const a=Number(r.amount)||0, d=normTxt(r.desc);
    if(!a&&!d) return;
    if(num){ if(a!==num) return; } else if(q){ if(!d.includes(q)) return; }
    if(!amtOk(a)) return;
    hits.push({m:v.month,d:v.day,p:v.page,lab,desc:r.desc||'',a});
   }); });
  if((sec==='all'||sec==='closer') && !num && !minA && !maxA){ const c=normTxt(v.closer); if(c&&(!q||c.includes(q))&&(q||sec==='closer')) hits.push({m:v.month,d:v.day,p:v.page,lab:'سكّر الصندوق',desc:v.closer,a:0}); }
 });
 hits.sort((a,b)=>a.m-b.m||a.d-b.d||a.p-b.p);
 lastHits=hits.map(h=>({...h,y:Y}));
 const parts=[]; if(q) parts.push('"'+srchVal('srch').trim()+'"'); if(sec!=='all') parts.push((SRCH_SECS.find(x=>x[0]===sec)||[0,'سكّر الصندوق'])[1]); if(per!=='all') parts.push(per==='1'?'صباح':'مسا'); if(fromV) parts.push('من '+fromV); if(toV) parts.push('لـ '+toV); if(minA) parts.push('≥ '+fmt(minA)); if(maxA) parts.push('≤ '+fmt(maxA));

 if(!hits.length){ el.innerHTML='<div class="small">ما لقيت شي.</div>'; return; }
 const tot=hits.reduce((s,h)=>s+h.a,0);
 const bySec={}; hits.forEach(h=>{ if(h.a) bySec[h.lab]=(bySec[h.lab]||0)+h.a; });
 const secHTML=Object.keys(bySec).length>1?`<div class="kpis" style="margin-bottom:8px">${Object.entries(bySec).map(([l,v])=>`<div class="kpi"><span class="small">${l}</span><b>${fmt(v)}</b></div>`).join('')}</div>`:'';
 el.innerHTML=`<div class="tot" style="border-top:none;margin-top:0"><span>${hits.length} نتيجة</span><span>المجموع ${fmt(tot)}</span></div>${secHTML}

async function exportSearch(){
 try{
  if(!lastHits.length){ toast('اعمل بحث أول',true); return; }
  if(typeof XLSX==='undefined'){ toast('❌ مكتبة Excel ما تحملت، جرب تاني',true); return; }
  const dl=await claude.use('downloads');
  if(!dl){ toast('❌ غير متاح بهذا العارض',true); return; }
  const rows=[['نتائج البحث: '+(lastFilterLabel||'الكل')],[],['التاريخ','اليوم','الفترة','القسم','البيان','المبلغ']];
  lastHits.forEach(h=>rows.push([`${String(h.d).padStart(2,'0')}/${String(h.m).padStart(2,'0')}/${h.y}`,dayNameOf(h.y,h.m,h.d),h.p===1?'صباحاً':'مساءً',h.lab,h.desc,h.a||0]));
  rows.push([]); rows.push(['','','','','المجموع',lastHits.reduce((s,h)=>s+h.a,0)]);
  const ws=XLSX.utils.aoa_to_sheet(rows);
  ws['!cols']=[{wch:12},{wch:10},{wch:9},{wch:13},{wch:28},{wch:14}];
  const wb=XLSX.utils.book_new(); wb.Workbook={Views:[{RTL:true}]};
  XLSX.utils.book_append_sheet(wb,ws,'نتائج البحث');
  const buf=XLSX.write(wb,{bookType:'xlsx',type:'array'});
  await dl.save({filename:fileBase('بحث.xlsx'),data:buf});
  toast('✅ تم تجهيز الملف');
 }catch(err){
  if(err&&err.code==='declined') return;
  toast('❌ ما انعمل التصدير: '+(err&&err.message?err.message:err),true);
 }
}

function keepForm(fn,ids){ return function(){ const vals={}, act=document.activeElement&&document.activeElement.id;
 ids.forEach(id=>{ const e=document.getElementById(id); if(e) vals[id]=e.value; });

 ids.forEach(id=>{ const e=document.getElementById(id); if(e&&vals[id]!==undefined) e.value=vals[id]; });
 if(act&&ids.includes(act)){ const e=document.getElementById(act); if(e) e.focus(); }
 return r; }; }

function healthCheck(){
 const probs=[], ops=[];
 const pages=allJarda.filter(isWritten);
 const exp={}; pages.forEach(v=>Object.assign(exp,expectedWd(v)));
 const have={}; (wdAllDocs||[]).forEach(d=>{ if(String(d.id).startsWith('from_')) have[d.id]=d.data(); });
 let syncBad=0;
 Object.entries(exp).forEach(([id,w])=>{ const h=have[id]; if(!h||h.name!==w.name||Number(h.amount)!==w.amount||h.date!==w.date){ syncBad++; ops.push({op:'set',id,data:w}); } });
 Object.keys(have).forEach(id=>{ if(!exp[id]){ syncBad++; ops.push({op:'del',id}); } });
 if(syncBad) probs.push({t:`👷 ${syncBad} سحب بدفتر العمال مش مطابق لصفحات الجردة`,fix:true});
 const pg=v=>`<button class="sm ghost" onclick="openPage(${v.month},${v.day},${v.page})">${v.day}/${v.month} ${v.page===1?'🌅':'🌙'}</button>`;
 const L={expenses:'مصروف',withdrawals:'سحب',suppliers:'دفعة تاجر'};
 pages.forEach(v=>{
  const nn={};
  Object.keys(L).forEach(k=>(v[k]||[]).forEach(r=>{ const a=Number(r.amount)||0, d=String(r.desc||'').trim();
   if(a && !d){ nn[k]=nn[k]||{n:0,s:0}; nn[k].n++; nn[k].s+=a; }
   else if(a>0 && a<1000) probs.push({t:`${L[k]} "${esc(d)}" مبلغو ${fmt(a)} بس — يمكن دولار ما تحوّل؟`,b:pg(v)});
   else if(a>=1000000000) probs.push({t:`${L[k]} "${esc(d)}" مبلغو ${fmt(a)} — كبير كتير، في صفر زيادة؟`,b:pg(v)});
   else if(a<0) probs.push({t:`${L[k]} "${esc(d)}" بالسالب`,b:pg(v)});
  }));
  Object.keys(nn).forEach(k=>probs.push({t:`${nn[k].n} سطر ${L[k]} بلا اسم (مجموعن ${fmt(nn[k].s)})`,b:pg(v)}));
  if((Number(v.box2)||0)>5000) probs.push({t:`صندوق الدولار ${fmt(v.box2)} $ — يمكن انكتب بالليرة بالغلط؟`,b:pg(v)});
  if(!(Number(v.jardaValue)||0)) probs.push({t:'صفحة بلا رقم جردة',b:pg(v)});
 });
 (wdAllDocs||[]).forEach(d=>{ const v=d.data(); if(String(d.id).startsWith('from_')) return;
  if(monthOfDate(v.date)===null) probs.push({t:`سحب ${esc(v.name)} ${fmt(v.amount)} تاريخو "${esc(v.date||'فاضي')}" مش من ${YEAR} — ما بينحسب بولا شهر`});
  if(!employeesList.some(e=>e.name===v.name)) probs.push({t:`سحب باسم "${esc(v.name)}" مش موجود بلائحة الموظفين`});
 });
 return {probs,ops};
}
async function fixSync(btn){
 const {ops}=healthCheck(); if(!ops.length) return;
 if(btn){ btn.disabled=true; btn.textContent='⏳ عم صلّح...'; }
 let bad=0;
 for(const o of ops){ try{ if(o.op==='set') await db.doc('withdrawals/'+o.id).set({...o.data,ts:Date.now()}); else await db.doc('withdrawals/'+o.id).delete(); }catch(e){ bad++; } }
 toast(bad?'⚠️ '+bad+' ما تصلّحو، جرّب كمان مرة':'✅ تصلّح دفتر السحوبات — صار مطابق للصفحات',!!bad);
}

 ${probs.length>60?`<div class="small">و ${probs.length-60} غيرن...</div>`:''}</div>`;

function askText(msg,val){
 return new Promise(res=>{
  const box=document.getElementById('askModal');
  box.innerHTML=`<div class="card" style="max-width:420px;width:100%;margin:0"><div style="font-weight:bold;margin-bottom:8px">${esc(msg)}</div><input id="askInp" value="${esc(val||'')}"><div class="row" style="margin-top:10px"><button id="askYes" style="padding:12px">💾 احفظ</button><button id="askNo" class="ghost" style="padding:12px">سكّر</button></div></div>`;
  box.style.display='flex';
  const inp=document.getElementById('askInp'); setTimeout(()=>{ inp.focus(); inp.select(); },50);
  const done=v=>{ box.style.display='none'; box.innerHTML=''; res(v); };
  document.getElementById('askYes').onclick=()=>done(inp.value);
  document.getElementById('askNo').onclick=()=>done(null);
  inp.onkeydown=e=>{ if(e.key==='Enter'){ e.preventDefault(); e.stopPropagation(); done(inp.value); } };
 });
}
